<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Preview - WebXR</title>
  
  <!-- Εισαγωγή της βιβλιοθήκης Google model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    .ar-button {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background-color: #0078d4;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <model-viewer 
    src="scene.glb" 
    alt="3D animation πόλης και αεροπλάνου"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    autoplay 
    shadow-intensity="1"
    environment-image="neutral">
    
    <button slot="ar-button" class="ar-button">
      Είσοδος σε AR (WebXR)
    </button>
  </model-viewer>

</body>
</html>
